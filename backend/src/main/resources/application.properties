# Server Configuration
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration 
# මම මේක ඔයා දුන්න Atlas link එකටම හැදුවා
spring.data.mongodb.uri=${MONGO_URI}

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcampus.hub=DEBUG

# OAuth2 Google Configuration
# පස්සේ ඇත්තම ID/Secret හම්බුණාම මේවා replace කරන්න. දැනට error එක එන එක නවත්තන්න මම මේවා dummy values දැම්මා.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.google.client-id=${spring.security.oauth2.client.registration.google.client-id}

# JWT Configuration
# Variable එක වෙනුවට කෙලින්ම Secret key එක මෙතනට දැම්මා
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173