# Server Configuration
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../frontend/.env[.properties]
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration 
# Configured to use the provided MongoDB Atlas connection uri
# Provide a local fallback for development if MONGO_URI isn't set
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/smartcampus}

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcampus.hub=DEBUG

# OAuth2 Google Configuration
# Replace these with the actual ID/Secret via environment variables later. Dummy values were initially used to prevent startup errors.
# Provide empty fallbacks so app can start without the env vars set in development
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:${VITE_GOOGLE_CLIENT_ID:dummy-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
app.google.client-id=${spring.security.oauth2.client.registration.google.client-id}

# JWT Configuration
# The Secret key is securely injected here via the environment variables
# For local development a default Base64-encoded 32-byte key is provided as a
# fallback. Replace with a secure value in production or set the JWT_SECRET
# environment variable.
app.jwt.secret=${JWT_SECRET:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin Configuration
app.admin.google-email=${ADMIN_GOOGLE_EMAIL:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173