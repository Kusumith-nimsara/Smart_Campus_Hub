# Server Configuration
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# MongoDB Configuration 
# Configured to use the provided MongoDB Atlas connection uri
spring.data.mongodb.uri=${MONGO_URI}

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartcampus.hub=DEBUG
logging.level.com.smartcampus.hub.controller.AuthController=DEBUG
logging.level.com.smartcampus.hub.service.AuthService=DEBUG

# OAuth2 Google Configuration
# Replace these with the actual ID/Secret via environment variables later. Dummy values were initially used to prevent startup errors.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
app.google.client-id=${spring.security.oauth2.client.registration.google.client-id}

# JWT Configuration
# The Secret key is securely injected here via the environment variables
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin Configuration
app.admin.google-email=${ADMIN_GOOGLE_EMAIL:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://127.0.0.1:5173